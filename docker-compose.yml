version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hospital_ai_qdrant_vectordb
    restart: always
    ports:
      - "6333:6333" # REST API e Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - ./hospital_ai_assistant/storage/qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=4
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

